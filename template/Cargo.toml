[workspace]
[package]
name = "milestone_vault"
version = "0.1.0"
edition = "2024"
description = "Milestone Vault - milestone-based escrow payments on Tari Ootle"
license = "MIT"

[package.metadata.tari-template]
tags = ["escrow", "payments", "freelance", "milestones"]
category = "finance"
documentation = "https://github.com/MerioneEason/tari-milestone-vault"
homepage = "https://github.com/MerioneEason/tari-milestone-vault"

[dependencies]
tari_template_lib = { version = "=0.40.1" }

[dev-dependencies]
tari_template_test_tooling = "=0.53.3"

[lib]
crate-type = ["cdylib"]

[profile.release]
opt-level = 's'     # Optimize for size.
lto = true          # Enable Link Time Optimization.
codegen-units = 1   # Reduce number of codegen units to increase optimizations.
panic = 'abort'     # Abort on panic.
strip = true        # Strip symbols and debug info.

# Wasmer and Cranelift are extremely slow when compiled in debug mode (~10x slower),
# which makes template tests painfully slow. Optimize these specific crates even in
# dev/test builds.
[profile.dev.package.wasmer]
opt-level = 2
[profile.dev.package.wasmer-compiler]
opt-level = 2
[profile.dev.package.wasmer-compiler-cranelift]
opt-level = 2
[profile.dev.package.cranelift-codegen]
opt-level = 2
[profile.dev.package.cranelift-frontend]
opt-level = 2
[profile.dev.package.cranelift-entity]
opt-level = 2

[build-dependencies]
tari_ootle_template_build = "=0.20.0"
